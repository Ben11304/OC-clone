name: Notify public repo to redeploy

on:
  workflow_run:
    workflows: ["Generate AI Catalog"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger public repo deploy
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.PUBLIC_REPO_TOKEN }}" \
            https://api.github.com/repos/ruoxinx/open-construction/dispatches \
            -d '{"event_type":"data-repo-update"}'
